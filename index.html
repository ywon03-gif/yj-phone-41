<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>원유주의 아이폰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:url('fonts/PretendardVariable.woff2') format('woff2-variations')}
/* Layout: 화면 가운데에 아이폰 프레임 1대. 폰 너비(≤520px)에서는 프레임 없이 화면 전체가 아이폰 화면이 됨 */
:root{
  --page:#e6e9ee; --page-ink:#5d6573; --frame:#1d1e21; --frame-hi:#45474d;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --sb:54px; --ios-blue:#007AFF; --sep:#e5e5ea;
  --panel:#fbfbfc; --ink:#1c2028; --muted:#6a7180; --line:#e1e4ea; --field:#ffffff; --accent:#2f5bea; --on-accent:#ffffff; --danger:#cf3a2e; --ok:#1d8a54; --warn:#a86500; --chip:#eef1f6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#101215;--page-ink:#8a919d;--frame:#2a2b2f;--frame-hi:#55575d;--panel:#16181c;--ink:#e7e9ee;--muted:#98a0ad;--line:#2b2f37;--field:#1e2127;--accent:#7393ff;--on-accent:#0d1020;--danger:#ff7a6e;--ok:#5fd29a;--warn:#f0b35a;--chip:#232731;color-scheme:dark}}
:root[data-theme="dark"]{--page:#101215;--page-ink:#8a919d;--frame:#2a2b2f;--frame-hi:#55575d;--panel:#16181c;--ink:#e7e9ee;--muted:#98a0ad;--line:#2b2f37;--field:#1e2127;--accent:#7393ff;--on-accent:#0d1020;--danger:#ff7a6e;--ok:#5fd29a;--warn:#f0b35a;--chip:#232731;color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--page);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ios-blue);outline-offset:2px}
#stage{height:100%;box-sizing:border-box;padding-block:14px;transition:padding-right .25s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#fit{position:relative;flex:none;box-sizing:border-box}
#phone{position:absolute;left:0;top:0;width:418px;height:872px;box-sizing:border-box;transform-origin:0 0;transform:scale(var(--s,1));border-radius:70px;background:var(--frame);padding:14px;box-shadow:0 0 0 2px var(--frame-hi),0 0 0 5px #0b0b0c,0 30px 60px -20px rgba(0,0,0,.45)}
.side{position:absolute;background:var(--frame);border-radius:3px;width:5px}
.side.l1{left:-7px;top:150px;height:32px}.side.l2{left:-7px;top:210px;height:62px}.side.l3{left:-7px;top:286px;height:62px}.side.r1{right:-7px;top:240px;height:96px}
#caption{color:var(--page-ink);font-size:12.5px;letter-spacing:.01em;text-align:center}
html.full #stage{padding:0;gap:0}
@media (min-width:900px){html.ed-open:not(.full) #stage{padding-right:min(480px,52vw)}}

/* ---------- 설정 편집 패널 (기기 밖, 페이지 테마를 따름) ---------- */
#edbtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;align-items:center;gap:7px;background:var(--accent);color:var(--on-accent);font-size:13.5px;font-weight:600;padding:10px 15px;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
html.full #edbtn{bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:8px 12px;font-size:12.5px;opacity:.9}
html.ed-open #edbtn{display:none}
#editor{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);z-index:210;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);font-size:14px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:900px){#editor{width:min(480px,52vw);border-left:1px solid var(--line);box-shadow:none}}
#editor.show{transform:none}
.ed-head{display:flex;align-items:center;justify-content:space-between;padding:16px max(18px,env(safe-area-inset-right,0px)) 12px 20px;border-bottom:1px solid var(--line);flex:none}
.ed-head h2{margin:0;font-size:18px;letter-spacing:-.01em}
.ed-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ed-x{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;line-height:1}
.ed-x:hover{background:var(--chip)}
#ed-body{flex:1;min-height:0;overflow-y:auto;padding:6px 20px 30px;overscroll-behavior:contain}
.ed-sec{padding:18px 0 6px}
.ed-sec h3{margin:0 0 12px;font-size:15px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ed-sec h3 span{font-size:12px;font-weight:400;color:var(--muted)}
.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ed-f{display:flex;flex-direction:column;gap:5px;min-width:0}
.ed-f.wide{grid-column:1/-1}
.ed-l{font-size:12.5px;font-weight:600;color:var(--ink)}
.ed-f small{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:-2px}
.ed-f input,.ed-f textarea,.ed-f select{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;box-sizing:border-box;min-width:0}
.ed-f textarea{line-height:1.55;resize:vertical;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Apple SD Gothic Neo","Noto Sans KR",monospace;font-size:13px}
.ed-f input:focus,.ed-f textarea:focus,.ed-f select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.ed-card{border:1px solid var(--line);border-radius:12px;background:var(--field);margin-bottom:10px}
.ed-card summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:14.5px}
.ed-card summary::-webkit-details-marker{display:none}
.ed-card summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.ed-card[open] summary::before{transform:rotate(45deg)}
.ed-card summary span{margin-left:auto;font-size:11.5px;color:var(--accent);background:var(--chip);padding:2px 8px;border-radius:10px;white-space:nowrap}
.ed-card .ed-grid{padding:2px 14px 6px}
.ed-card-foot{display:flex;justify-content:flex-end;padding:6px 14px 12px}
.ed-del{font-size:12.5px;color:var(--danger);padding:5px 10px;border-radius:8px}
.ed-del.armed{background:var(--danger);color:var(--panel)}
.ed-add{width:100%;border:1px dashed var(--line);border-radius:12px;padding:11px;color:var(--accent);font-weight:600;font-size:13.5px}
.ed-add:hover,.ed-del:hover{background:var(--chip)}
.ed-help{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.ed-help summary{cursor:pointer;font-weight:600;color:var(--accent)}
.ed-help p{color:var(--muted);line-height:1.6;margin:10px 0;max-width:65ch}
.ed-help p b{color:var(--ink)}
.ed-help pre{background:var(--chip);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.6;overflow-x:auto;margin:0}
.ed-foot{flex:none;border-top:1px solid var(--line);padding:12px max(18px,env(safe-area-inset-right,0px)) 14px 20px;display:flex;flex-direction:column;gap:10px}
#ed-status{font-size:12.5px;color:var(--muted);line-height:1.45;min-height:1.45em}
#ed-status[data-kind="ok"]{color:var(--ok)}#ed-status[data-kind="warn"]{color:var(--warn)}#ed-status[data-kind="err"]{color:var(--danger)}
.ed-btns{display:flex;gap:8px}
.ed-btns button{flex:1;padding:10px 8px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid var(--line);color:var(--ink)}
.ed-btns button:hover{background:var(--chip)}
.ed-btns #ed-save{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ed-btns #ed-save:hover{filter:brightness(1.05)}
@media (max-width:420px){.ed-grid{grid-template-columns:1fr}}
html.full #fit{width:100%!important;height:100%!important}
html.full #phone{position:static;transform:none;width:100%;height:100%;padding:0;border-radius:0;box-shadow:none;background:none}
html.full #screen{width:100%;height:100%;border-radius:0}
html.full .side,html.full #caption{display:none}

/* ---------- 화면 공통 (기기 안은 실제 앱처럼 라이트 모드 고정) ---------- */
#screen{position:relative;width:390px;height:844px;border-radius:56px;overflow:hidden;background:#000;color:#000;isolation:isolate;font-size:15px;user-select:none;-webkit-user-select:none;color-scheme:light}
#screen *{box-sizing:border-box}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{display:block}
#sb{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:60;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;pointer-events:none;color:#000;transition:color .3s}
#sb.light{color:#fff}
#sb .clock{font-weight:600;font-size:16.5px;width:62px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#sb .right{display:flex;gap:6px;align-items:center}
#island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:61;pointer-events:none}
#homebar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:180px;height:30px;z-index:80;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
#homebar span{width:136px;height:5px;border-radius:3px;background:#000;transition:background .3s}
#homebar.light span{background:#fff}
#toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,10px);width:max-content;max-width:310px;z-index:90;background:rgba(28,28,30,.93);color:#fff;font-size:13.5px;line-height:1.5;padding:12px 16px;border-radius:14px;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;word-break:keep-all;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.top{bottom:auto;top:178px}

/* ---------- 홈 화면 ---------- */
#home{position:absolute;inset:0;background:
  radial-gradient(120% 70% at 85% 8%,#7fb8ff 0%,rgba(127,184,255,0) 55%),
  radial-gradient(90% 60% at 10% 95%,#1745e6 0%,rgba(23,69,230,0) 60%),
  linear-gradient(165deg,#4f97ff 0%,#2a64f5 45%,#1d4fe8 100%);
  padding:calc(var(--sb) + 14px) 22px 0;display:flex;flex-direction:column}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;justify-items:center}
.widget{grid-column:1/3;grid-row:1/3;width:100%;max-width:158px;aspect-ratio:1;border-radius:22px;background:#fff;padding:14px 15px;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.widget .wd{color:#ff3b30;font-size:13px;font-weight:600;letter-spacing:.02em}
.widget .dn{font-size:44px;font-weight:300;line-height:1;margin-top:2px;letter-spacing:-.02em}
.widget .ev{margin-top:auto;border-left:3px solid #ff9f0a;padding-left:7px;font-size:12px;line-height:1.35}
.widget .ev b{display:block;font-weight:600}
.widget .ev span{color:#8e8e93}
.app-ic{display:flex;flex-direction:column;align-items:center;gap:5px;width:70px}
.app-ic .sq{width:62px;height:62px;border-radius:15px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .15s}
.app-ic:active .sq{transform:scale(.92);filter:brightness(.85)}
.app-ic .sq img{width:100%;height:100%;display:block;object-fit:cover}
.app-ic .lb{color:#fff;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.35);white-space:nowrap;letter-spacing:-.01em}
.todo-ic{width:100%;height:100%;background:linear-gradient(160deg,#39d9a3,#14b886);display:flex;align-items:center;justify-content:center}
.hsearch{margin:auto auto 14px;display:flex;align-items:center;gap:4px;color:#fff;font-size:13px;font-weight:500;padding:6px 13px;border-radius:20px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.dock{margin:0 -10px 10px;border-radius:34px;background:rgba(255,255,255,.24);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);padding:16px 16px;display:flex;justify-content:center;gap:24px}
.dock .lb{display:none}

/* ---------- 앱 레이어 & 화면 스택 ---------- */
#app{position:absolute;inset:0;z-index:20;background:#fff;transform:scale(.1);opacity:0;border-radius:56px;overflow:hidden;transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .22s,border-radius .42s}
#app.open{transform:none;opacity:1;border-radius:0}
html.full #app{border-radius:0}
.scr{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;overflow:hidden;transition:transform .36s cubic-bezier(.2,.8,.2,1),filter .36s}
.scr.in{transform:translateX(100%)}
.scr.under{transform:translateX(-26%);filter:brightness(.92)}
.pad-top{padding-top:var(--sb)}
.tabbar{flex:none;display:flex;justify-content:space-around;align-items:flex-start;padding:8px 6px 30px;background:#fff;border-top:.5px solid #e6e6e6}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#a0a0a0}
.tabbar button.on{color:#111}
.flex1{flex:1;min-height:0}

/* ---------- 키보드 & 입력창 ---------- */
.kbhost{flex:none}
.kb{background:#d1d4da;padding:8px 3px 0;touch-action:manipulation}
.kb-row{display:flex;gap:6px;margin-bottom:11px;justify-content:center}
.kb-row.r2{padding:0 calc((100% - 6px*9) / 20)}
.key{flex:1 1 0;min-width:0;height:43px;border-radius:6px;background:#fff;box-shadow:0 1px 0 #8a8b8f;font-size:22px;display:flex;align-items:center;justify-content:center;color:#000;font-family:var(--font);touch-action:manipulation}
.key.fn{background:#abb0ba;font-size:15px}
.key.w13{flex:1.32 1 0}.key.w2{flex:2.4 1 0}.key.w5{flex:5.4 1 0}
.key.sp{font-size:15px}
.key.pressed,.key:active{background:#abb0ba}
.key.fn.pressed,.key.fn:active,.key.fn.lit{background:#fff}
.kb-row.r3 .key.w13:first-child{margin-right:8px}.kb-row.r3 .key.w13:last-child{margin-left:8px}
.kb-strip{height:46px;display:flex;justify-content:space-between;align-items:flex-start;padding:4px 24px 0;color:#50545c}
.ime{white-space:pre-wrap;word-break:break-all}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--ios-blue);vertical-align:-.2em;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ph{color:#a3a3a3}
.reply-bar{display:flex;align-items:flex-start;gap:8px;padding:9px 14px;font-size:12.5px;line-height:1.4;border-top:.5px solid #e2e2e2;background:#fff}
.reply-bar .rb-t{flex:1;min-width:0}
.reply-bar b{display:block;font-weight:600}
.reply-bar span{display:block;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-back{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.25);display:flex;align-items:flex-end;justify-content:center;padding:0 10px 34px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;display:flex;flex-direction:column;gap:8px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grp{background:rgba(250,250,250,.97);border-radius:14px;overflow:hidden}
.sheet .q{padding:12px 16px;font-size:12.5px;color:#8a8a8e;text-align:center;border-bottom:.5px solid #ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet button{display:block;width:100%;padding:16px;font-size:18px;color:var(--ios-blue);text-align:center}
.sheet button+button{border-top:.5px solid #ddd}
.sheet .cancel{background:#fff;border-radius:14px;font-weight:600}

/* ---------- 카카오톡 ---------- */
.k-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 10px 20px}
.k-head h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.02em}
.k-head .acts{display:flex;gap:16px}
.k-ad{margin:2px 16px 8px;border-radius:12px;background:#f6f6f6;padding:12px 14px;font-size:12.5px;color:#555;display:flex;justify-content:space-between}
.k-room{display:flex;align-items:center;gap:12px;padding:8px 18px;width:100%;text-align:left}
.k-room:active{background:#f3f3f3}
.k-room .tx{flex:1;min-width:0}
.k-room .nm{font-size:15px;font-weight:600;display:flex;gap:5px;align-items:baseline}
.k-room .nm em{font-style:normal;color:#aaa;font-weight:500;font-size:14px}
.k-room .pv{font-size:13px;color:#8b8b8b;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-room .tm{font-size:11px;color:#aaa;align-self:flex-start;margin-top:4px;white-space:nowrap}
.k-av{width:48px;height:48px;border-radius:18px;background:#9fb8ce;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.k-av.sm{width:38px;height:38px;border-radius:14px}
.k-av.big{width:58px;height:58px;border-radius:22px}
.k-av.grp{background:none;border-radius:0;position:relative;overflow:visible}
.k-av.grp i{position:absolute;width:24px;height:24px;border-radius:38%;overflow:hidden;display:block;box-shadow:0 0 0 1.5px #fff,0 1px 2px rgba(0,0,0,.06)}
.k-av.grp i svg{display:block;width:100%;height:100%;transform:translateY(3%) scale(.5);opacity:.85}
.k-av.grp.n4 i:nth-child(1){left:0;top:0}.k-av.grp.n4 i:nth-child(2){right:0;top:0}.k-av.grp.n4 i:nth-child(3){left:0;bottom:0}.k-av.grp.n4 i:nth-child(4){right:0;bottom:0}
.k-av.grp.n3 i{width:27px;height:27px}
.k-av.grp.n3 i:nth-child(1){left:10.5px;top:-1px}.k-av.grp.n3 i:nth-child(2){left:-1px;top:21px}.k-av.grp.n3 i:nth-child(3){left:22px;top:21px}
.k-av.grp.n2 i{width:30px;height:30px}.k-av.grp.n2 i:nth-child(1){left:0;top:0}.k-av.grp.n2 i:nth-child(2){right:0;bottom:0}
.k-av.grp.n1 i{width:48px;height:48px;left:0;top:0}
.k-sec{font-size:12px;color:#999;padding:12px 20px 6px}
.k-me{display:flex;align-items:center;gap:14px;padding:6px 20px 14px;border-bottom:.5px solid #eee}
.k-me b{font-size:17px}
.room-k{background:#bacee0}
.room-k .rhead{display:flex;align-items:center;gap:6px;padding:6px 12px 8px 8px;flex:none}
.room-k .rhead .ttl{flex:1;min-width:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-k .rhead .ttl em{font-style:normal;color:#6a7480;font-weight:500;margin-left:4px;font-size:15px}
.k-msgs{padding:4px 10px 12px;display:flex;flex-direction:column}

.tt{margin:0 10px;border:1px solid #e3e3e3;border-radius:14px;overflow:hidden;position:relative}
.tt-days{display:grid;grid-template-columns:24px repeat(5,1fr);font-size:11.5px;color:#666;text-align:center;border-bottom:1px solid #e9e9e9}

.tt-body{display:grid;grid-template-columns:24px repeat(5,1fr);position:relative}
.tt-hours div{height:52px;font-size:11px;color:#888;text-align:right;padding:3px 4px 0 0;border-bottom:1px solid #ededed}
.tt-col{position:relative;border-left:1px solid #ededed;background:repeating-linear-gradient(#fff 0 51px,#ededed 51px 52px)}
.tt-blk{position:absolute;left:0;right:0;padding:4px 5px;font-size:11.5px;line-height:1.28;color:#4b4b4b;overflow:hidden}

.tt-sheet{flex:none;border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.07);background:#fff;padding:0;position:relative;z-index:2;margin-top:-16px;display:flex;flex-direction:column;overflow:hidden;height:48%;transition:height .28s cubic-bezier(.2,.8,.2,1)}
.tt-sheet.drag{transition:none}
.tt-grab{flex:none;height:30px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.tt-grab:active{cursor:grabbing}
.tt-sheet .hd{width:40px;height:5px;border-radius:3px;background:#d4d4d4;display:block}
.tt-sheet .srch{flex:none}
.tt-frlist{flex:1;min-height:0;overflow-y:auto}
.tt-gpa{margin:12px 10px 4px;border:1px solid #e3e3e3;border-radius:16px;padding:18px 16px 20px}
.tt-gpa .hd2{display:flex;align-items:center;justify-content:space-between;color:#222}
.tt-gpa .hd2 b{font-size:20px;letter-spacing:-.01em}
.tt-gpa .row{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:18px;font-size:15px;color:#222;align-items:baseline}
.tt-gpa .row span{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.tt-gpa em{font-style:normal;color:#f23d3d;font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.tt-gpa i{font-style:normal;color:#9a9a9a;font-size:14px;margin-left:-5px}
.tt-sheet .srch{display:flex;align-items:center;gap:12px;padding:0 16px 6px}
.tt-sheet .srch div{flex:1;display:flex;gap:8px;align-items:center;background:#f2f2f2;border-radius:14px;padding:11px 14px;color:#a5a5a5;font-size:15px}
.tt-fr{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #f0f0f0}
.tt-fr:last-child{border-bottom:0}
.tt-fr .nm{flex:1;line-height:1.3}
.tt-fr .nm b{font-size:16.5px;font-weight:500;display:block}
.tt-fr .nm span{font-size:13px;color:#888}
.tt-fr .nm span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#cfcfcf;margin-right:5px;vertical-align:1px}
.tt-fr .pl{display:flex;align-items:center;border:1px solid #e9e9e9;border-radius:22px;padding:7px 14px;gap:14px;color:#333}
.tt-fr .pl i{width:1px;height:16px;background:#e4e4e4}
.et-list-h{display:flex;align-items:center;gap:8px;padding:6px 14px 10px 8px;border-bottom:1px solid #f0f0f0;flex:none}
.et-list-h b{flex:1;font-size:17px}
.et-post{padding:14px 18px;border-bottom:1px solid #f2f2f2}
.et-post b{font-size:15px;display:block}
.et-post p{margin:4px 0 7px;font-size:13.5px;color:#555;line-height:1.45}
.et-post .m{display:flex;justify-content:space-between;font-size:11.5px;color:#aaa}
.et-post .m span:last-child{display:flex;gap:8px}
.et-post .lk{color:#e3463b}.et-post .cm{color:#2a9fd6}
.et-boards button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 20px;font-size:15.5px}
.et-boards .pin{color:#f0412c}
.et-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;gap:10px;font-size:14px}

/* ---------- 투두메이트 ---------- */
.td-top{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 8px;flex:none}
.td-top .me{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.td-mo{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 6px}
.td-mo b{font-size:17px}
.td-mo .nv{display:flex;gap:16px;color:#888}
.td-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px 0;padding:4px 14px 12px;text-align:center}
.td-cal .wk{font-size:11.5px;color:#999}
.td-day{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#555}
.td-day i{width:26px;height:26px;border-radius:9px;background:#eef0f2;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:#fff}
.td-day i.dn{background:#2ccb93}
.td-day i.pt{background:#a8e8cf}
.td-day.today span{background:#111;color:#fff;border-radius:8px;padding:0 5px}
.td-cat{margin:16px 18px 6px;display:inline-flex;align-items:center;gap:6px;background:#f3f4f6;border-radius:16px;padding:5px 11px;font-weight:600;font-size:14px}
.td-cat i{width:9px;height:9px;border-radius:50%}
.td-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 20px;font-size:15px}
.td-chk{width:24px;height:24px;border-radius:8px;background:#e8eaed;display:flex;align-items:center;justify-content:center;color:#fff;flex:none;transition:background .15s}
.td-item.done .t{color:#9a9a9a}

/* ---------- 전화 ---------- */
.ph-title{font-size:33px;font-weight:700;padding:4px 18px 8px;letter-spacing:-.02em}
.ph-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 0;color:var(--ios-blue);font-size:17px;flex:none}
.seg{display:flex;background:#eeeef0;border-radius:9px;padding:2px;font-size:13px;font-weight:600;color:#000}
.seg span{padding:5px 22px;border-radius:7px}
.seg span.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ph-row{display:flex;align-items:center;gap:12px;padding:0 0 0 18px;width:100%;text-align:left}
.ph-row .in{flex:1;display:flex;align-items:center;gap:8px;padding:10px 16px 10px 0;border-bottom:.5px solid var(--sep);min-width:0}
.ph-row .nm{flex:1;min-width:0;line-height:1.25}
.ph-row .nm b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-row .nm span{font-size:14px;color:#8e8e93}
.ph-row.miss .nm b{color:#ff3b30}
.ph-row .tm{color:#8e8e93;font-size:15px;white-space:nowrap}
.ph-row .info{color:var(--ios-blue)}
.ph-contact{display:block;width:100%;text-align:left;padding:11px 18px;font-size:17px;border-bottom:.5px solid var(--sep)}
.ph-letter{background:#f6f6f6;font-size:13px;font-weight:600;color:#8e8e93;padding:4px 18px}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;justify-content:center;margin-top:auto}
.pad button{width:78px;height:78px;border-radius:50%;background:#e5e5ea;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.pad button:active{background:#c7c7cc}
.pad b{font-size:34px;font-weight:400}
.pad small{font-size:9.5px;letter-spacing:.18em;font-weight:600;margin-top:2px}
.pad-num{text-align:center;font-size:36px;height:56px;margin-top:40px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.callbtn{width:78px;height:78px;border-radius:50%;background:#34c759;color:#fff;display:flex;align-items:center;justify-content:center;margin:20px auto 0}

/* ---------- 메모 ---------- */
.nt{background:#f2f2f7}
.nt .nav{display:flex;align-items:center;justify-content:space-between;color:#e0a800;padding:8px 14px 0 8px;font-size:17px;flex:none}
.nt h1{font-size:33px;margin:0;padding:6px 18px 10px;letter-spacing:-.02em}
.nt .card{background:#fff;border-radius:12px;margin:0 16px}
.nt .item{display:block;width:100%;text-align:left;padding:11px 16px 11px 0;margin-left:16px;border-bottom:.5px solid var(--sep);line-height:1.35}
.nt .item:last-child{border-bottom:0}
.nt .item b{font-size:16px;display:block}
.nt .item span{font-size:14px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nt .item span em{font-style:normal;color:#3a3a3c;margin-right:6px}
.nt .grp{font-size:20px;font-weight:700;padding:16px 18px 8px}
.nt .foot{flex:none;display:flex;align-items:center;justify-content:center;position:relative;padding:12px 0 34px;font-size:11.5px;color:#3a3a3c;background:rgba(242,242,247,.95)}
.nt .foot .ic{position:absolute;right:18px;top:8px;color:#e0a800}
.nt-doc{padding:4px 22px 40px;font-size:16.5px;line-height:1.55;white-space:pre-wrap}
.nt-doc .dt{text-align:center;color:#8e8e93;font-size:13px;margin-bottom:12px}
.nt-doc h2{font-size:26px;margin:0 0 8px;letter-spacing:-.02em;white-space:normal}

/* ---------- 통화 ---------- */
#call{position:absolute;inset:0;z-index:40;color:#fff;background:radial-gradient(120% 70% at 50% 0%,#4a5160 0%,#262a31 50%,#14161a 100%);display:flex;flex-direction:column;align-items:center;padding:calc(var(--sb) + 30px) 0 60px;opacity:0;transition:opacity .3s;cursor:default}
#call.show{opacity:1}
#call .who{font-size:32px;font-weight:400;letter-spacing:-.01em;text-align:center}
#call .sub{font-size:16px;color:rgba(255,255,255,.65);margin-top:4px;font-variant-numeric:tabular-nums}
#call .line{flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding:0 30px;text-align:center}
#call .line p{margin:0;font-size:21px;line-height:1.55;word-break:keep-all;animation:lineIn .35s ease}
#call .line p b{color:#9fd4ff;font-weight:600;margin-right:6px}
@keyframes lineIn{from{opacity:0;transform:translateY(8px)}}
#call .grid{display:grid;grid-template-columns:repeat(3,76px);gap:20px 26px}
#call .grid div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px}
#call .grid span.c{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center}
#call .end{width:76px;height:76px;border-radius:50%;background:#ff3b30;display:flex;align-items:center;justify-content:center;margin-top:26px;flex:none}
#call .inc{margin-top:auto;width:100%;display:flex;justify-content:space-around;padding:0 30px}
#call .inc>div{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13.5px}
#call .inc .small{display:flex;flex-direction:row;justify-content:space-around;width:100%;padding:0 30px;margin:auto 0 50px;font-size:13px;color:rgba(255,255,255,.85)}
#call .acc{width:76px;height:76px;border-radius:50%;background:#34c759;display:flex;align-items:center;justify-content:center;animation:ring 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{transform:none}10%{transform:rotate(-12deg)}20%{transform:rotate(12deg)}30%{transform:rotate(-8deg)}40%{transform:none}}

/* ---------- 투두메이트 (2차) ---------- */
.td-top{justify-content:flex-end;padding:6px 20px 2px}
.td-fr{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 4px;scrollbar-width:none;flex:none}
.td-fr::-webkit-scrollbar{display:none}
.td-pill{display:flex;align-items:center;gap:9px;flex:none;background:#f2f3f5;border-radius:26px;padding:4px 16px 4px 4px;font-size:15px;font-weight:600;white-space:nowrap}
.td-pill.on{background:#111;color:#fff}
.td-pill.add{padding:0;width:46px;height:42px;justify-content:center}
.td-prof{display:flex;align-items:center;gap:16px;padding:16px 20px 4px}
.td-prof b{font-size:21px;display:block;margin-bottom:4px}
.td-prof .sw{font-size:16px}
.td-mo{display:flex;align-items:center;gap:8px;padding:20px 14px 10px;justify-content:flex-start}
.td-mo b{font-size:19px;flex:1;margin-left:6px;letter-spacing:-.01em}
.td-mo .sel{display:flex;align-items:center;gap:6px;border:1px solid #eceef1;border-radius:22px;padding:7px 12px;font-size:12px;color:#111}
.td-mo .dots3{display:flex}
.td-mo .dots3 i{width:16px;height:16px;border-radius:50%;margin-left:-6px;border:1.5px solid #fff}
.td-mo .dots3 i:first-child{margin-left:0}
.td-mo .rb{min-width:38px;height:38px;border:1px solid #eceef1;border-radius:19px;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0 9px;color:#111}
.td-cal{gap:12px 0;padding:6px 8px 8px}
.td-cal .wk{font-size:13px;color:#333}
.td-cal .wk.sun,.td-day .sun{color:#ef4444}
.td-cal .wk.sat,.td-day .sat{color:#3b7cf0}
.td-day{gap:4px;font-size:13.5px;color:#222}
.td-day span{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.td-day.today span{background:#111;color:#fff;border-radius:50%;font-weight:600}
.clv{display:inline-flex;flex:none}
.clv svg{display:block}
.td-cat{display:inline-flex;align-items:center;gap:8px;margin:20px 16px 4px;background:#f2f3f5;border-radius:24px;padding:5px 5px 5px 14px;font-size:15.5px}
.td-cat .pl{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-left:6px;color:#111}
.td-item{display:flex;align-items:flex-start;gap:13px;width:100%;text-align:left;padding:9px 18px;font-size:16.5px}
.td-item .tx{display:flex;flex-direction:column;gap:4px;padding-top:5px;min-width:0}
.td-item .tm{display:flex;align-items:center;gap:5px;font-size:13.5px;color:#555}
.td-item .tm .ic{color:#c9cbd0}
.td-item.done .t{color:#111}

/* ---------- 사진·릴스 메시지 ---------- */
.ig-wrap.wide{max-width:86%}
.ig-mrow{display:flex;align-items:center;gap:12px}
.ig-row.me .ig-mrow{flex-direction:row-reverse}
.ig-media{width:200px;max-width:100%;border-radius:18px;overflow:hidden;background:#efefef;touch-action:pan-y;flex:none}
.ig-media img{display:block;width:100%;height:auto;-webkit-user-drag:none}
.ig-media.reel{aspect-ratio:468/859}
.ig-media.reel img{height:100%;object-fit:cover}
.ig-media.hold,.k-media.hold{filter:brightness(.9)}
.ig-side{display:flex;flex-direction:column;gap:12px}
.ig-side span{width:42px;height:42px;border-radius:50%;background:#f3f3f5;display:flex;align-items:center;justify-content:center;color:#111}
.k-media{width:190px;max-width:100%;border-radius:12px;overflow:hidden;background:transparent;touch-action:pan-y}
.k-media.emo,.ig-media.emoticon{width:120px;border-radius:0;background:none;overflow:visible}
.k-media img{display:block;width:100%;-webkit-user-drag:none}
.missing{display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;aspect-ratio:1;width:100%}

/* ---------- 편집 패널 추가 요소 ---------- */
.ed-nav{position:sticky;top:-6px;z-index:2;display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;margin:0 -2px;background:var(--panel);scrollbar-width:none}
.ed-nav::-webkit-scrollbar{display:none}
.ed-nav button{flex:none;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:16px;background:var(--chip);color:var(--ink)}
.ed-nav button:hover{background:var(--line)}
.ed-thumb{display:flex;justify-content:flex-start}
.ed-thumb img{max-height:140px;max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.ed-chk{flex-direction:row;align-items:center;gap:8px;align-self:end;padding-bottom:9px}
.ed-chk input{width:18px;height:18px;accent-color:var(--accent)}
.ed-f input[type=color]{height:38px;padding:3px 5px;cursor:pointer}

/* ---------- 배경화면 · 잠금화면 ---------- */
#home{background:#cfd0cf center/cover no-repeat}
.app-ic .lb{text-shadow:0 0 6px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.6);font-weight:500}
.hsearch{background:rgba(90,90,90,.32)}
.dock{background:rgba(255,255,255,.3)}
#sb.light #carrier{color:#fff}
#carrier{font-size:15px;font-weight:600;letter-spacing:.01em}
#lock{position:absolute;inset:0;z-index:45;background:#cfd0cf center/cover no-repeat;color:#fff;transition:transform .45s cubic-bezier(.3,.8,.2,1),opacity .45s;overflow:hidden}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.lk-main{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--sb) + 6px);cursor:pointer;touch-action:none}
.lk-lockic{opacity:.95;filter:drop-shadow(0 1px 4px rgba(0,0,0,.25))}
.lk-date{margin-top:12px;font-size:20px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.28)}
.lk-time{font-family:"Pretendard Variable",Pretendard,"SF Pro Rounded",ui-rounded,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;font-weight:700;font-size:100px;line-height:1.02;letter-spacing:-.025em;text-shadow:0 2px 16px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.lk-bottom{position:absolute;left:0;right:0;bottom:60px;display:flex;justify-content:space-between;padding:0 46px}
.lk-btn{width:52px;height:52px;border-radius:50%;background:rgba(40,40,40,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center}
.lk-hint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:13px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.35)}

.lk-pad{display:grid;grid-template-columns:repeat(3,78px);gap:18px 28px}

.lk-acts{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:space-between;padding:0 50px;font-size:17px}

.mu-card{display:flex;flex-direction:column;text-align:left;gap:2px;min-width:0}
.mu-card .cv{aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;margin-bottom:6px;border:.5px solid rgba(0,0,0,.06)}
.mu-card .cv img,.mu-cover img{width:100%;height:100%;object-fit:cover;display:block}
.mu-card b{font-size:15px;font-weight:500}
.mu-card span{font-size:15px;color:#8a8a8e}
.mu-th{border-radius:5px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.mu-th img{width:100%;height:100%;object-fit:cover}
.mu-eq{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;gap:3px;font-style:normal}
.mu-eq b{width:3px;height:14px;background:#fff;border-radius:2px;animation:eq 0.9s ease-in-out infinite alternate}
.mu-eq b:nth-child(2){animation-delay:.3s;height:20px}.mu-eq b:nth-child(3){animation-delay:.6s}
@keyframes eq{to{transform:scaleY(.35)}}
.mu-dock{position:absolute;left:0;right:0;bottom:0;padding:0 14px 30px;display:flex;flex-direction:column;gap:8px;z-index:3;background:linear-gradient(rgba(255,255,255,0),#fff 40%)}
.mu-dock.dark{background:linear-gradient(rgba(0,0,0,0),var(--mubg) 45%)}
.mu-mini{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #ececef;border-radius:30px;padding:7px 18px 7px 8px;box-shadow:0 4px 18px rgba(0,0,0,.08);min-width:0;flex:1}
.mu-mini .tx{flex:1;min-width:0;line-height:1.25}
.mu-mini .tx b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-mini .tx span{font-size:13.5px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mu-mini button{color:#111;display:flex}
.mu-mini.dark{background:#141a0e;border-color:#141a0e;color:#fff}
.mu-mini.dark .tx span{color:rgba(255,255,255,.7)}
.mu-mini.dark button{color:#fff}
.mu-tabs{display:flex;justify-content:space-around;background:#fff;border:1px solid #ececef;border-radius:34px;padding:7px 6px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.mu-tabs span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 6px;border-radius:24px;color:#111;min-width:56px;white-space:nowrap}
.mu-tabs span.on{background:#f0f0f2;color:#fa2d48}
.mu-row{display:flex;align-items:center;gap:10px}
.mu-circ{width:56px;height:56px;border-radius:50%;background:#fff;border:1px solid #ececef;box-shadow:0 4px 18px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;flex:none;color:#111}
.mu-dock.dark .mu-circ{background:#141a0e;border-color:#141a0e;color:#fff}
.mu-acc{padding:20px;text-align:center}
.mu-acc b{font-size:24px;display:block;margin-bottom:24px}
.mu-acc-list{text-align:left}
.mu-pl{background:var(--mubg);color:#fff}
.mu-top{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;flex:none}
.mu-dk{height:52px;min-width:52px;border-radius:26px;background:rgba(20,26,12,.85);color:#fff;display:flex;align-items:center;justify-content:center;gap:26px}
.mu-dk.pill{padding:0 20px}
.mu-cover{width:300px;max-width:78%;aspect-ratio:1;margin:4px auto 0;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18);background:rgba(255,255,255,.15)}
.mu-ttl{text-align:center;padding:22px 16px 14px;line-height:1.3}
.mu-ttl b{display:block;font-size:24px}

.mu-acts{display:flex;align-items:center;justify-content:center;gap:16px;padding-bottom:22px}
.mu-rb{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center}
.mu-play{height:52px;padding:0 54px;border-radius:26px;background:#fff;color:color-mix(in srgb,var(--mubg) 62%,#000);font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px}

.mu-song .tx span{font-size:14.5px;opacity:.75}

// 공감: 메시지 끝에 {하트 2, 좋아요 8, 웃겨요 1} 처럼 붙여요
const REACT_KEYS = { '하트': 'heart', '♡': 'heart', '❤': 'heart', '❤️': 'heart', '좋아요': 'like', '최고': 'like', '👍': 'like', '체크': 'check', '확인': 'check', '✓': 'check', '✔': 'check', '웃겨요': 'laugh', '😆': 'laugh', '😂': 'laugh', '놀라워요': 'wow', '😮': 'wow', '슬퍼요': 'sad', '😢': 'sad' };
function splitReacts(text) {
  const m = String(text).match(/^(.*?)\s*\{([^{}]*)\}\s*$/s);
  if (!m) return { text, reacts: null };
  const reacts = [];
  m[2].split(/[,，]/).map(x => x.trim()).filter(Boolean).forEach(part => {
    const r = part.match(/^(.+?)\s*(\d+)$/);
    const key = r && REACT_KEYS[r[1].trim()];
    if (key && +r[2] > 0) reacts.push({ key, n: +r[2] });
  });
  return reacts.length ? { text: m[1], reacts } : { text, reacts: null };
}
function parseHistory(text, where, errs) {
  const out = [];
  String(text || '').split('\n').forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const m = line.match(HIST_RE);
    if (!m) { errs.push(`${where} ${i + 1}번째 줄: "[10/12 20:05] 이름: 내용" 형식으로 적어 주세요`); return; }
    const day = parseDayTok(m[1]);
    if (day == null) { errs.push(`${where} ${i + 1}번째 줄: 날짜 '${m[1]}'을(를) 알아볼 수 없어요 (예: 10/12, 10월 12일, 어제)`); return; }
    const H = Number(m[2]), M = Number(m[3]);
    if (H > 23 || M > 59) { errs.push(`${where} ${i + 1}번째 줄: 시각이 올바르지 않아요`); return; }
    if (!m[5].trim()) return; // 내용이 빈 줄은 건너뛰어요
    const t = String(H).padStart(2, '0') + ':' + String(M).padStart(2, '0');
    const rx = splitReacts(m[5]);
    const msg = { day, t, text: unesc(rx.text), unread: 0, reacts: rx.reacts };
    if (m[4] === '나') msg.me = true; else msg.who = m[4];
    out.push(msg);
  });
  const k = m => m.day * 1440 + +m.t.slice(0, 2) * 60 + +m.t.slice(3);
  return out.map((m, i) => [m, i]).sort((a, b) => k(a[0]) - k(b[0]) || a[1] - b[1]).map(x => x[0]);
}
function parseScript(text, where, errs) {
  const out = [];
  String(text || '').split('\n').forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const w = line.match(/^\(\s*(?:대기|쉬기)\s*([\d.]+)\s*초?\s*\)$/);
    if (w) { out.push({ wait: Math.min(60, Number(w[1])) * 1000 }); return; }
    const m = line.match(/^(.+?)\s*[:：]\s?(.*)$/);
    if (!m) { errs.push(`${where} ${i + 1}번째 줄: "이름: 대사" 형식으로 적어 주세요`); return; }
    if (m[1] === '나') { out.push({ me: true, hint: m[2].trim() }); return; }
    let t = m[2].trim(), reply = null;
    if (t.startsWith('[답장]')) { reply = 'last-mine'; t = t.slice(4).trim(); }
    if (!t) { errs.push(`${where} ${i + 1}번째 줄: 대사가 비어 있어요`); return; }
    out.push({ who: m[1].trim(), text: unesc(t), reply });
  });

const mins = m => m.day * 1440 + Number(m.t.slice(0, 2)) * 60 + Number(m.t.slice(3));
const igAgo = m => { const n = vnow(); const diff = n.getHours() * 60 + n.getMinutes() - mins(m); if (diff < 1) return '방금'; if (diff < 60) return diff + '분'; if (diff < 1440) return Math.floor(diff / 60) + '시간'; if (diff < 10080) return Math.floor(diff / 1440) + '일'; return Math.floor(diff / 10080) + '주'; };

const STATE = { status: {}, active: null };   // 메모리에만 존재 → 새로고침 시 초기화
const typingMs = t => Math.min(TYPING.max, Math.max(TYPING.min, TYPING.base + [...t].length * TYPING.perChar));

// 나가기/종료 버튼 공통 처리: 이벤트 중 첫 시도는 경고, 두 번째 시도는 강제종료 후 실행
function attemptExit(fn) {
  const a = STATE.active;
  if (a) {
    if (!a.armed) { a.armed = true; toast(WARN_TEXT, 4500); return; }
    abortActive();
  }
  fn && fn();
}
function abortActive() {
  const a = STATE.active; if (!a) return;
  a.tok.aborted = true;
  a.tok.timers.forEach(clearTimeout);
  if (a.tok.wake) a.tok.wake();
  STATE.status[a.id] = 'aborted';
  STATE.active = null;
  toastEl.classList.remove('show');
  a.cleanup && a.cleanup();
  afterEvent(a.id);
}
function finishActive(a) {
  if (STATE.active !== a) return;
  STATE.status[a.id] = 'done';
  STATE.active = null;
  a.cleanup && a.cleanup();
  afterEvent(a.id);
}
function afterEvent(id) {
  CALL_EVENTS.filter(c => c.start === id && !STATE.status[c.id]).forEach(scheduleCall);
}
function scheduleCall(ev) {
  STATE.status[ev.id] = 'scheduled';
  const gen = GEN;
  const tryStart = () => {
    if (gen !== GEN) return;
    if (locked || STATE.active || appBusy || !callEl.hidden) { setTimeout(tryStart, 700); return; }
    startCall(ev);
  };
  setTimeout(tryStart, ev.delay || 0);
}
function makeTok() {
  const tok = { aborted: false, timers: [], wake: null };
  tok.sleep = ms => new Promise(r => tok.timers.push(setTimeout(r, ms)));
  return tok;
}

// 채팅 이벤트 실행. ctx는 채팅방 화면이 넘겨주는 조작 함수 묶음
async function runChat(ev, ctx) {
  const tok = makeTok();
  const a = { id: ev.id, type: 'chat', tok, armed: false, room: ctx.key,
    cleanup: () => { ctx.room.typing = null; ctx.endInput(); ctx.render(); } };
  STATE.active = a; STATE.status[ev.id] = 'running';
  ctx.startInput();
  await tok.sleep(700);
  for (const step of ev.script) {
    if (tok.aborted) return;
    if (step.wait) { await tok.sleep(step.wait); continue; }
    if (step.me) {
      ctx.setHint(step.hint || '');
      await new Promise(r => { tok.wake = r; ctx.waiter = r; });
      tok.wake = null; ctx.waiter = null; ctx.setHint('');
      if (tok.aborted) return;
      await tok.sleep(600);
      continue;
    }
    // 상대 차례: 1 사라짐/읽음 → 점 애니메이션(글자수 비례) → 전송
    if (ctx.markRead()) { ctx.render(); await tok.sleep(READ_TO_TYPING); }
    else await tok.sleep(350);
    if (tok.aborted) return;
    const who = step.who || ctx.defaultWho;
    ctx.room.typing = who; ctx.render();
    await tok.sleep(typingMs(step.text));
    if (tok.aborted) return;
    ctx.room.typing = null;
    ctx.room.msgs.push({ who, text: step.text, day: 0, t: nowHM(), reply: ctx.resolveReply(step.reply) });
    ctx.render();
    await tok.sleep(450);
  }
  if (tok.aborted) return;
  await tok.sleep(300);
  finishActive(a);
}
function pendingChatEvent(app, roomId) {
  return CHAT_EVENTS.find(e => e.app === app && e.room === roomId && !STATE.status[e.id]);
}

const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ', 'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
const VCOMB = { 'ㅗㅏ': 'ㅘ', 'ㅗㅐ': 'ㅙ', 'ㅗㅣ': 'ㅚ', 'ㅜㅓ': 'ㅝ', 'ㅜㅔ': 'ㅞ', 'ㅜㅣ': 'ㅟ', 'ㅡㅣ': 'ㅢ' };
const CCOMB = { 'ㄱㅅ': 'ㄳ', 'ㄴㅈ': 'ㄵ', 'ㄴㅎ': 'ㄶ', 'ㄹㄱ': 'ㄺ', 'ㄹㅁ': 'ㄻ', 'ㄹㅂ': 'ㄼ', 'ㄹㅅ': 'ㄽ', 'ㄹㅌ': 'ㄾ', 'ㄹㅍ': 'ㄿ', 'ㄹㅎ': 'ㅀ', 'ㅂㅅ': 'ㅄ' };
const VSPLIT = {}, CSPLIT = {};
for (const k in VCOMB) VSPLIT[VCOMB[k]] = [...k];
for (const k in CCOMB) CSPLIT[CCOMB[k]] = [...k];
const isJamo = c => CHO.includes(c) || JUNG.includes(c);
class Ime {
  constructor() { this.text = ''; this.c = this.v = this.t = null; }
  comp() {
    if (this.c && this.v) return String.fromCharCode(0xAC00 + (CHO.indexOf(this.c) * 21 + JUNG.indexOf(this.v)) * 28 + JONG.indexOf(this.t || ''));
    return this.c || this.v || '';
  }
  commit() { this.text += this.comp(); this.c = this.v = this.t = null; }
  value() { return this.text + this.comp(); }
  jamo(j) {
    if (JUNG.includes(j)) {
      if (this.t) {
        let nc; const sp = CSPLIT[this.t];
        if (sp) { this.t = sp[0]; nc = sp[1]; } else { nc = this.t; this.t = null; }
        this.commit(); this.c = nc; this.v = j;
      } else if (this.v) {
        const cv = VCOMB[this.v + j];
        if (cv) this.v = cv; else { this.commit(); this.v = j; }
      } else this.v = j;
    } else {
      if (this.t) {
        const cc = CCOMB[this.t + j];
        if (cc) this.t = cc; else { this.commit(); this.c = j; }
      } else if (this.c && this.v) {
        if (JONG.includes(j)) this.t = j; else { this.commit(); this.c = j; }
      } else { this.commit(); this.c = j; }
    }
  }
  char(ch) { this.commit(); this.text += ch; }
  back() {
    if (this.t) { const sp = CSPLIT[this.t]; this.t = sp ? sp[0] : null; }
    else if (this.v) { const sv = VSPLIT[this.v]; this.v = sv ? sv[0] : null; }
    else if (this.c) this.c = null;
    else this.text = [...this.text].slice(0, -1).join('');
  }
  clear() { this.text = ''; this.c = this.v = this.t = null; }
}

function kbPress(k) {
  if (!KB.ime) return;
  const ime = KB.ime; let rebuild = false;
  switch (k) {
    case 'SHIFT': KB.shift = !KB.shift; rebuild = true; break;
    case 'BK': ime.back(); break;
    case 'SPACE': ime.char(' '); break;
    case 'RET': ime.char('\n'); break;
    case 'NUM': KB.layer = 'num'; rebuild = true; break;
    case 'SYM': KB.layer = 'sym'; rebuild = true; break;
    case 'ABC': KB.layer = 'abc'; rebuild = true; break;
    case 'LANG': ime.commit(); KB.lang = KB.lang === 'ko' ? 'en' : 'ko'; KB.layer = 'abc'; KB.shift = false; rebuild = true; break;
    case 'SEND': kbSend(); return;
    default:
      if (isJamo(k)) ime.jamo(k); else ime.char(k);
      if (KB.shift) { KB.shift = false; rebuild = true; }
  }
  if (rebuild) kbBuild();

}
function kbRefresh() { if (KB.cfg) KB.cfg.onChange(KB.ime.value()); }
function kbSend() {
  if (!KB.ime) return;
  KB.ime.commit();
  const v = KB.ime.value().replace(/^\s+|\s+$/g, '');
  if (!v) return;
  KB.ime.clear(); kbRefresh();
  KB.cfg.onSend(v);
}
function flashKey(k) {
  if (!KB.el) return;
  const b = [...KB.el.querySelectorAll('.key')].find(x => x.dataset.k === k);

}
// 컴퓨터 키보드로도 입력 가능(운영체제 한/영 상태와 무관하게 키 위치 기준으로 입력)
document.addEventListener('keydown', e => {
  if (!KB.el || e.metaKey || e.ctrlKey) return;
  if (e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
  let k = null;
  if (e.code === 'Backspace') k = 'BK';
  else if (e.code === 'Enter' || e.code === 'NumpadEnter') k = e.shiftKey ? 'RET' : 'SEND';
  else if (e.code === 'Space') k = 'SPACE';
  else if (e.code === 'Lang1' || e.key === 'HangulMode' || e.code === 'AltRight') k = 'LANG';
  else if (e.altKey) return;
  else if (KB.lang === 'ko' && KO_MAP[e.code]) k = (e.shiftKey && KO_SHIFT[e.code]) || KO_MAP[e.code];
  else if (/^Key[A-Z]$/.test(e.code)) k = e.shiftKey ? e.code[3] : e.code[3].toLowerCase();
  else if (e.key && e.key.length === 1) k = e.key;
  else if (/^Digit\d$/.test(e.code)) k = e.code.slice(5);
  if (k == null) return;
  e.preventDefault();
  if (k === 'BK' || k === 'SPACE' || k === 'RET' || k === 'LANG' || k === 'SEND') kbPress(k);
  else { const ime = KB.ime; if (isJamo(k)) ime.jamo(k); else ime.char(k); kbRefresh(); }
  flashKey(k);
});

// 입력창 표시: 입력한 글자 + 커서, 비어 있으면 안내문구
function paintField(fld, value, hint, active) {
  put(fld, );

  if (value) fld.append(h('span', { class: 'ime' }, value), h('i', { class: 'caret' }));
  else fld.append(h('i', { class: 'caret' }), h('span', { class: 'ph' }, ' ' + hint));
  fld.scrollTop = fld.scrollHeight;
}

// 길게 누르기(또는 우클릭) → 답장 메뉴
function longPress(el, fn) {
  let t = 0, sx = 0, sy = 0;
  el.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; t = setTimeout(() => { el.classList.add('hold'); fn(); setTimeout(() => el.classList.remove('hold'), 250); }, 450); });
  const stop = () => clearTimeout(t);
  el.addEventListener('pointerup', stop); el.addEventListener('pointercancel', stop); el.addEventListener('pointerleave', stop);
  el.addEventListener('pointermove', e => { if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 10) stop(); });
  el.addEventListener('contextmenu', e => { e.preventDefault(); stop(); fn(); });
}

let cur = null, appBusy = false;
function openApp(id, from) {

  appBusy = true;
  const r = from.getBoundingClientRect(), s = screen.getBoundingClientRect();
  const sc = s.width / screen.offsetWidth || 1;
  appEl.style.transformOrigin = `${(r.left + r.width / 2 - s.left) / sc}px ${(r.top + r.height / 2 - s.top) / sc}px`;
  put(appEl, ); appEl.hidden = false; appEl.classList.remove('open');
  cur = { id, stack: [] };
  APPS[id]();
  void appEl.offsetWidth;
  appEl.classList.add('open');
  setTimeout(() => { appBusy = false; }, 420);
}
function goHome() {
  if (!cur) return;
  const top = cur.stack.at(-1); if (top && top._leave) top._leave();
  appBusy = true; cur = null; kbHide();
  appEl.classList.remove('open'); setSB('light');
  setTimeout(() => { appEl.hidden = true; put(appEl, ); appBusy = false; }, 380);
}
function push(el, sbMode = 'dark') {
  el.classList.add('scr'); el._sb = sbMode;
  const prev = cur.stack.at(-1);
  if (prev) {
    el.classList.add('in'); appEl.append(el);
    requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.remove('in'); prev.classList.add('under'); }));
  } else appEl.append(el);
  cur.stack.push(el); setSB(sbMode);
  return el;
}
function pop() {
  if (!cur || cur.stack.length < 2) return;
  const el = cur.stack.pop(), prev = cur.stack.at(-1);
  if (el._leave) el._leave();
  el.classList.add('in'); prev.classList.remove('under'); setSB(prev._sb);
  if (prev._show) prev._show();
  setTimeout(() => el.remove(), 400);
}

function appIcon(id, label, img, badge) {
  const sq = h('div', { class: 'sq' });
  if (img) sq.append(h('img', { src: img, alt: '' }));
  else sq.append(h('div', { class: 'todo-ic', html: '<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5.5" stroke-width="2"/><path d="M8 12.3l2.8 2.8L16.3 9"/></svg>' }));
  const b = h('button', { class: 'app-ic', type: 'button', 'aria-label': label }, sq, h('span', { class: 'lb' }, label), badge ? h('b', { class: 'bdg' }, badge) : null);
  b.addEventListener('click', () => openApp(id, sq));
  return b;
}
function nextClass() {
  for (let off = 1; off <= 7; off++) {
    const dw = dayDate(off).getDay();
    const list = TIMETABLE.filter(c => c.days.includes(dw)).sort((a, b) => a.start.localeCompare(b.start));
    if (list.length) return { off, c: list[0] };
  }
  return null;
}
function buildHome() {
  const t = dayDate(0), nc = nextClass();
  const when = nc ? (nc.off === 1 ? '내일 ' : DOW[dayDate(nc.off).getDay()] + '요일 ') + nc.c.start : '';
  const widget = h('div', { class: 'widget', 'aria-label': '캘린더' },
    h('div', { class: 'wd' }, DOW[t.getDay()] + '요일'),
    h('div', { class: 'dn' }, t.getDate()),
    nc ? h('div', { class: 'ev' }, h('b', null, nc.c.name), h('span', null, when + ' · ' + nc.c.room)) : null);
  put(homeEl, 
    h('div', { class: 'hgrid' }, widget,
      appIcon('ev', '에브리타임', ICONS.ev), appIcon('todo', 'todo mate', ICONS.todo),
      appIcon('notes', '메모', ICONS.notes), appIcon('insta', 'Instagram', ICONS.insta),
      appIcon('music', '음악', ICONS.music), appIcon('naver', 'NAVER', ICONS.naver, NAVER && NAVER.badge)),
    h('div', { class: 'hsearch' }, ic('search', 13, 2.4), '검색'),
    h('div', { class: 'dock' }, appIcon('phone', '전화', ICONS.phone), appIcon('kakao', '카카오톡', ICONS.kakao)));
}

    ], () => ({ name: '', sub: '휴대전화', when: '오늘', missed: false }), r => r.name || '이름 없음', r => r.when, rerender),
    h('details', { class: 'ed-help' }, h('summary', null, '작성법 자세히 보기'),
      h('div', null,

        h('pre', null, '[9/28 23:10] 지한이🐶: 형법 판례 진짜 끝이 없다\n[10월 3일 08:15] 아빠: 용돈 보냈다\n[어제 21:03] 동생: 내 충전기 가져갔지\n[오늘 13:05] 나: 10시쯤 나갈 듯'),
        h('p', null, '날짜는 10/3 · 10월 3일 · 2026-10-03처럼 직접 쓰거나, 오늘 · 어제 · 그저께 · N일 전처럼 써요. 오늘·어제는 기본 정보의 \'폰 기준 시각\'을 기준으로 해요. 시각은 24시간제예요. 한 메시지 안에서 줄을 바꾸려면 \\n 을 적어요.'),
        h('p', null, h('b', null, '이벤트 대본'), ' — 방을 처음 열면 위에서부터 순서대로 진행돼요.'),

}
function openEditor() {
  if (!DRAFT) DRAFT = withDefaults(SAVED);
  renderEditor();
  edPanel.hidden = false; document.documentElement.classList.add('ed-open');
  requestAnimationFrame(() => edPanel.classList.add('show'));
  fit();
}
function closeEditor() {
  edPanel.classList.remove('show'); document.documentElement.classList.remove('ed-open');
  setTimeout(() => { edPanel.hidden = true; fit(); }, 250);
  fit();
}
function tryApply() {
  const { errs, data } = compile(DRAFT);
  if (errs.length) { setStatus('고칠 곳이 있어요: ' + errs.slice(0, 3).join(' / ') + (errs.length > 3 ? ` 외 ${errs.length - 3}개` : ''), 'err'); return null; }
  install(data);
  return data;
}
$('#ed-apply').addEventListener('click', () => { if (tryApply()) setStatus(dirty ? '폰에 적용했어요. 아직 저장 전이에요' : '폰에 적용했어요', dirty ? 'warn' : 'ok'); });
$('#ed-revert').addEventListener('click', () => { DRAFT = withDefaults(SAVED); dirty = false; renderEditor(); install(compile(SAVED).data); setStatus('저장된 설정으로 되돌렸어요', 'ok'); });
$('#ed-close').addEventListener('click', closeEditor);
edBtn.addEventListener('click', () => edPanel.hidden ? openEditor() : closeEditor());
let saving = false;
$('#ed-save').addEventListener('click', async () => {
  if (saving) return;
  if (!tryApply()) return;
  saving = true; setStatus('저장하는 중…', '');
  const json = JSON.stringify(DRAFT, null, 1);
  const attempt = async again => {
    try {
      if (!(window.claude && window.claude.use)) throw { code: 'not_granted' };
      const art = await claude.use('artifact');
      if (!art) throw { code: 'not_granted' };
      await art.publish({ 'config.json': { content: json, contentType: 'application/json' } });
      SAVED = clone(DRAFT); dirty = false;
      setStatus('저장했어요. 이제 링크로 들어오는 모든 사람에게 이 설정이 보여요', 'ok');
    } catch (e) {
      const code = e && e.code;
      if (code === 'upstream_error' && !again) { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); return attempt(true); }
      const msg = {
        conflict: '다른 곳에서 먼저 저장된 버전이 있어서 그 버전으로 다시 불러와요',
        not_writer: '이 계정은 이 페이지를 수정할 권한이 없어요',
        not_granted: '이 화면에서는 저장할 수 없어요. claude.ai에서 페이지를 열어 주세요',
        capability_disabled: '이 화면에서는 저장할 수 없어요. claude.ai에서 페이지를 열어 주세요',
        too_large: '설정이 너무 커서 저장하지 못했어요. 대화 기록을 조금 줄여 주세요',
        rate_limited: '저장이 너무 잦아요. 잠시 후 다시 눌러 주세요',
      }[code] || '저장하지 못했어요. 잠시 후 다시 눌러 주세요';
      setStatus(msg, 'err');
    }
  };
  await attempt(false);
  saving = false;
});
// 편집 권한이 있는 사람에게만 '설정 편집' 버튼을 보여줘요
(async () => {
  for (let i = 0; i < 20 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 250));
  if (!(window.claude && window.claude.use)) return;
  try {
    const user = await claude.use('user');
    if (user && await user.canEdit()) edBtn.hidden = false;
  } catch (e) { /* 편집 버튼 없이 보기 전용 */ }
})();

/* ---------- 화면 크기 맞추기 ----------
   실제 휴대폰(터치 + 작은 화면)에서만 프레임 없이 꽉 채우고,
   그 외에는 항상 실제 아이폰 비율(390×844) 그대로 창에 맞게 줄이거나 키워요. */
const fitEl = $('#fit'), phone = $('#phone'), stage = $('#stage'), cap = $('#caption');
const isPhoneDevice = () => (matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0) && Math.min(window.screen.width, window.screen.height) <= 540;
function fit() {
  const full = isPhoneDevice();
  document.documentElement.classList.toggle('full', full);
  if (full) { phone.style.removeProperty('--s'); fitEl.style.width = fitEl.style.height = ''; return; }
  const cs = getComputedStyle(stage);
  const W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (cap.offsetHeight + 10);
  const s = Math.max(.3, Math.min(1, H / 872, W / 418));
  phone.style.setProperty('--s', s);
  fitEl.style.width = 418 * s + 'px'; fitEl.style.height = 872 * s + 'px';
}
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
fit();

})();
</script>
